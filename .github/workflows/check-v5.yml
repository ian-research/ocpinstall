name: OpenShift 5 checks
on: [push, pull_request]
jobs:
  v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: v5/lib/operator-semantics/go.sum
      - run: python -m pip install PyYAML==6.0.3
      - name: Bash and ShellCheck
        run: |
          for script in v5/*.sh v5/lib/*.sh v5/config/*.sh; do bash -n "$script"; done
          shellcheck --external-sources --severity=warning v5/*.sh v5/lib/*.sh v5/config/*.sh
      - run: python -m unittest discover -s v5/tests -v
