name: OpenShift 4.22 Operator checks
on: [push, pull_request]
jobs:
  operators-422:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: v4.22/lib/operator-semantics/go.sum
      - run: python -m pip install PyYAML==6.0.3
      - name: Bash and ShellCheck
        run: |
          for script in v4.22/*.sh v4.22/lib/*.sh v4.22/config/*.sh; do bash -n "$script"; done
          shellcheck --external-sources --severity=warning v4.22/*.sh v4.22/lib/*.sh v4.22/config/*.sh
      - run: python -m unittest discover -s v4.22/tests -v
